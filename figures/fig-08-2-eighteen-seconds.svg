  <text class="num" text-anchor="middle" x="684.0" y="177.2">18.1</text>
  <text class="lbl" text-anchor="middle" x="684.0" y="350">30 Sep</text>
  <text class="small" text-anchor="middle" x="684.0" y="365">result</text>
  <text class="cap" x="92" y="392">Medians, both nodes Ready. 23 Sep steps N=3 (boot trims N=7); 30 Sep steps N=5.</text>
  <text class="cap" x="92" y="408">Grey step: a new session with a corrected stopwatch, not a speed-up.</text>
</svg>
