<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420"
     role="img" aria-labelledby="t82 d82" font-family="'Source Serif 4', Georgia, serif">
  <title id="t82">Figure 8.2 — From 33.7 s to 18.1 s: what each September change removed</title>
  <desc id="d82">Waterfall of median time to both nodes Ready. 17 September baseline 33.7 seconds. CAPK patch minus 0.3 (a tail fix: spread 31.5 to 1.6 seconds). Worker taint removed minus 0.4. Worker gated on the supervisor readyz endpoint minus 4.0. VM-to-VM routes minus 0.2. Guest boot trims minus 3.8, to 25.0. Re-baselined on 30 September with a corrected stopwatch, 24.4. Early k3s start minus 0.5. Cluster API reconciler rate limiting turned off minus 5.8. Result 18.1 seconds.</desc>

  <!-- Shared visual language for all figures in this book.
       Theme-aware: light palette on :root, dark redefined under prefers-color-scheme.
       Self-contained: no external fonts, no external references. -->
  <style>
    :root, svg {
      --ink:#1B2430; --ink2:#4A5563; --ink3:#737C86;
      --rule:#D6DAD3; --accent:#1F5F4A; --accent-soft:#E3EDE7; --flag:#A8442A;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --ink:#E6E8E3; --ink2:#A9B2BA; --ink3:#7E8892;
        --rule:#2A3642; --accent:#6FB79A; --accent-soft:#17302A; --flag:#E08A6B;
      }
    }
    .ink{fill:var(--ink)} .ink2{fill:var(--ink2)} .ink3{fill:var(--ink3)}
    .rule{stroke:var(--rule);stroke-width:1}
    .grid{stroke:var(--rule);stroke-width:1;stroke-dasharray:2 4}
    .dot{fill:var(--accent);opacity:.55}
    .med{stroke:var(--accent);stroke-width:3;stroke-linecap:round}
    .span{stroke:var(--accent);stroke-width:1.5;opacity:.5}
    .lbl{font-size:13px;fill:var(--ink2)}
    .num{font-size:13px;fill:var(--ink);font-weight:600;
         font-family:'IBM Plex Mono',Menlo,Consolas,monospace}
    .small{font-size:11px;fill:var(--ink3);
           font-family:'IBM Plex Mono',Menlo,Consolas,monospace}
    .bar{fill:var(--accent)}
    .bar2{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1}
    .base{fill:var(--rule)}
    .tot{fill:var(--ink3);opacity:.45}
    .conn{stroke:var(--ink3);stroke-width:1;stroke-dasharray:2 3}
    .cap{font-size:12px;fill:var(--ink3);font-style:italic}
  </style>

